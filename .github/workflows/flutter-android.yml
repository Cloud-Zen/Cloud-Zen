name: Cloud-Zen Android APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master:
    name: Build Master APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: master_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project
        run: flutter create --platforms=android --no-pub .

      - name: Force compileSdk 36 - Master
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle.kts"

          if [ -f "$FILE" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # Remove any accidental Groovy-style compileSdk line.
          s = re.sub(
              r'(?m)^[ \t]*compileSdk\s+36\s*$\n?',
              '',
              s
          )

          # Replace Kotlin DSL compileSdk assignment.
          s = re.sub(
              r'(?m)^([ \t]*)compileSdk\s*=\s*[^\n]+$',
              r'\1compileSdk = 36',
              s
          )

          # If no compileSdk assignment exists, add it inside android { }.
          if not re.search(r'(?m)^\s*compileSdk\s*=\s*36\s*$', s):
              s = re.sub(
                  r'(?m)^(\s*android\s*\{\s*)$',
                  r'\1\n    compileSdk = 36',
                  s,
                  count=1
              )

          p.write_text(s)
          PY
          else
            FILE="android/app/build.gradle"

            if [ -f "$FILE" ]; then
              python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s = re.sub(
              r'(?m)^[ \t]*compileSdk\s*=\s*[^\n]+$',
              '',
              s
          )

          s = re.sub(
              r'(?m)^([ \t]*)compileSdkVersion\s+[^\n]+$',
              r'\1compileSdkVersion 36',
              s
          )

          s = re.sub(
              r'(?m)^([ \t]*)compileSdk\s+[^\n]+$',
              r'\1compileSdk 36',
              s
          )

          if not re.search(r'(?m)^\s*compileSdk(?:Version)?\s+36\s*$', s):
              s = re.sub(
                  r'(?m)^(\s*android\s*\{\s*)$',
                  r'\1\n    compileSdk 36',
                  s,
                  count=1
              )

          p.write_text(s)
          PY
            else
              echo "ERROR: No Android app Gradle file found."
              exit 1
            fi
          fi

      - name: Verify Master compileSdk
        shell: bash
        run: |
          set -e

          if [ -f android/app/build.gradle.kts ]; then
            echo "===== master_app/android/app/build.gradle.kts ====="
            cat android/app/build.gradle.kts

            if grep -Eq '^[[:space:]]*compileSdk[[:space:]]+36[[:space:]]*$' android/app/build.gradle.kts; then
              echo "ERROR: Invalid Kotlin DSL syntax detected: compileSdk 36"
              exit 1
            fi

            if ! grep -Eq '^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*36[[:space:]]*$' android/app/build.gradle.kts; then
              echo "ERROR: compileSdk = 36 was not found."
              exit 1
            fi

            echo "Master compileSdk verification: PASSED"
          else
            echo "===== master_app/android/app/build.gradle ====="
            cat android/app/build.gradle

            if ! grep -Eq '^[[:space:]]*compileSdkVersion[[:space:]]+36[[:space:]]*$|^[[:space:]]*compileSdk[[:space:]]+36[[:space:]]*$' android/app/build.gradle; then
              echo "ERROR: compileSdk 36 was not found."
              exit 1
            fi

            echo "Master compileSdk verification: PASSED"
          fi

      - name: Get Master dependencies
        run: flutter pub get

      - name: Build Master APK
        run: flutter build apk --release

      - name: Upload Master APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-zen-master-apk
          path: master_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


  client:
    name: Build Client APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project
        run: flutter create --platforms=android --no-pub .

      - name: Force compileSdk 36 - Client
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle.kts"

          if [ -f "$FILE" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # IMPORTANT:
          # Kotlin DSL MUST use:
          # compileSdk = 36
          #
          # Never write:
          # compileSdk 36

          # Remove invalid Groovy-style syntax if it exists.
          s = re.sub(
              r'(?m)^[ \t]*compileSdk\s+36\s*$\n?',
              '',
              s
          )

          # Replace an existing Kotlin compileSdk assignment.
          s = re.sub(
              r'(?m)^([ \t]*)compileSdk\s*=\s*[^\n]+$',
              r'\1compileSdk = 36',
              s
          )

          # If compileSdk is missing, insert correct Kotlin DSL syntax.
          if not re.search(r'(?m)^\s*compileSdk\s*=\s*36\s*$', s):
              s = re.sub(
                  r'(?m)^(\s*android\s*\{\s*)$',
                  r'\1\n    compileSdk = 36',
                  s,
                  count=1
              )

          p.write_text(s)
          PY
          else
            FILE="android/app/build.gradle"

            if [ -f "$FILE" ]; then
              python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          # Remove Kotlin DSL syntax from Groovy files.
          s = re.sub(
              r'(?m)^[ \t]*compileSdk\s*=\s*[^\n]+$',
              '',
              s
          )

          # Correct Groovy syntax.
          s = re.sub(
              r'(?m)^([ \t]*)compileSdkVersion\s+[^\n]+$',
              r'\1compileSdkVersion 36',
              s
          )

          s = re.sub(
              r'(?m)^([ \t]*)compileSdk\s+[^\n]+$',
              r'\1compileSdk 36',
              s
          )

          if not re.search(r'(?m)^\s*compileSdk(?:Version)?\s+36\s*$', s):
              s = re.sub(
                  r'(?m)^(\s*android\s*\{\s*)$',
                  r'\1\n    compileSdk 36',
                  s,
                  count=1
              )

          p.write_text(s)
          PY
            else
              echo "ERROR: No Android app Gradle file found."
              exit 1
            fi
          fi

      - name: Verify Client compileSdk
        shell: bash
        run: |
          set -e

          if [ -f android/app/build.gradle.kts ]; then
            echo "===== client_app/android/app/build.gradle.kts ====="
            cat android/app/build.gradle.kts

            # This is the exact error from the previous failed build.
            if grep -Eq '^[[:space:]]*compileSdk[[:space:]]+36[[:space:]]*$' android/app/build.gradle.kts; then
              echo "ERROR: Invalid Kotlin DSL syntax detected."
              echo "Found: compileSdk 36"
              echo "Required: compileSdk = 36"
              exit 1
            fi

            if ! grep -Eq '^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*36[[:space:]]*$' android/app/build.gradle.kts; then
              echo "ERROR: compileSdk = 36 was not found."
              exit 1
            fi

            echo "Client compileSdk verification: PASSED"
          else
            echo "===== client_app/android/app/build.gradle ====="
            cat android/app/build.gradle

            if ! grep -Eq '^[[:space:]]*compileSdkVersion[[:space:]]+36[[:space:]]*$|^[[:space:]]*compileSdk[[:space:]]+36[[:space:]]*$' android/app/build.gradle; then
              echo "ERROR: compileSdk 36 was not found."
              exit 1
            fi

            echo "Client compileSdk verification: PASSED"
          fi

      - name: Get Client dependencies
        run: flutter pub get

      - name: Build Client APK
        run: flutter build apk --release

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-zen-client-apk
          path: client_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
