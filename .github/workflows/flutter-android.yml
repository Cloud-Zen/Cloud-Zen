      - name: Force Android compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              text = kts.read_text()

              # Remove every existing compileSdk declaration.
              text = re.sub(
                  r'(?m)^\s*compileSdk(?:Version)?\s*(?:=)?\s*[^\n]*\n?',
                  '',
                  text
              )

              # Kotlin DSL MUST use "=".
              text = text.replace(
                  'android {',
                  'android {\n    compileSdk = 36',
                  1
              )

              kts.write_text(text)
              print("Kotlin DSL detected: compileSdk = 36")

          elif groovy.exists():
              text = groovy.read_text()

              # Remove every existing compileSdk declaration.
              text = re.sub(
                  r'(?m)^\s*compileSdk(?:Version)?\s*(?:=)?\s*[^\n]*\n?',
                  '',
                  text
              )

              # Groovy DSL uses compileSdk 36.
              text = text.replace(
                  'android {',
                  'android {\n    compileSdk 36',
                  1
              )

              groovy.write_text(text)
              print("Groovy DSL detected: compileSdk 36")

          else:
              raise SystemExit(
                  "ERROR: Neither build.gradle.kts nor build.gradle exists."
              )
          PY

      - name: Verify compileSdk 36
        run: |
          echo "===== FINAL ANDROID GRADLE FILE ====="

          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          else
            echo "ERROR: Android Gradle file missing."
            exit 1
          fi

          echo ""
          echo "===== VERIFYING SDK ====="

          if [ -f android/app/build.gradle.kts ]; then

            grep -nE "compileSdk" android/app/build.gradle.kts

            if ! grep -qE "compileSdk[[:space:]]*=[[:space:]]*36" \
              android/app/build.gradle.kts; then
              echo "ERROR: Kotlin compileSdk 36 was not configured correctly."
              exit 1
            fi

            if grep -qE "compileSdk[[:space:]]+36" \
              android/app/build.gradle.kts; then
              echo "ERROR: Invalid Kotlin syntax detected: compileSdk 36"
              exit 1
            fi

          elif [ -f android/app/build.gradle ]; then

            grep -nE "compileSdk" android/app/build.gradle

            if ! grep -qE "compileSdk(Version)?[[:space:]]+36" \
              android/app/build.gradle; then
              echo "ERROR: Groovy compileSdk 36 was not configured correctly."
              exit 1
            fi

          fi

          echo ""
          echo "SUCCESS: compileSdk 36 syntax verified."
