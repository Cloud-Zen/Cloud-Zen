name: Cloud-Zen Android APKs

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Cloud-Zen backend HTTPS URL"
        required: true
        default: "https://cloud-zen-backend.onrender.com"

      client_apk_url:
        description: "HTTPS URL of the Client APK"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }} APK
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - master_app
          - client_app

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ============================================================
      # 3. VERIFY FLUTTER APP
      # ============================================================

      - name: Verify Flutter app
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Cloud-Zen Flutter App"
          echo "=========================================="
          echo "Application: ${{ matrix.app }}"
          echo ""

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          if [ ! -f "lib/main.dart" ]; then
            echo "ERROR: lib/main.dart not found."
            exit 1
          fi

          echo "pubspec.yaml: OK"
          echo "lib/main.dart: OK"

          echo ""
          echo "Flutter version:"
          flutter --version


      # ============================================================
      # 4. CREATE FRESH ANDROID PROJECT
      # ============================================================
      # IMPORTANT:
      # CI creates a completely fresh Android project.
      # This avoids stale/incomplete Android folders in the repository.
      # ============================================================

      - name: Generate fresh Android project
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          set -e

          echo "Removing old Android project if present..."

          rm -rf android

          echo "Generating fresh Android project..."

          flutter create \
            --platforms=android \
            .

          if [ ! -d "android" ]; then
            echo "ERROR: Android project was not generated."
            exit 1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml was not generated."
            exit 1
          fi

          echo ""
          echo "Fresh Android project generated successfully."


      # ============================================================
      # 5. REMOVE DEFAULT FLUTTER TEST
      # ============================================================

      - name: Remove default Flutter template test
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          set -e

          rm -f test/widget_test.dart

          echo "Default Flutter widget test removed."

          if [ -f "test/widget_test.dart" ]; then
            echo "ERROR: Default widget_test.dart still exists."
            exit 1
          fi


      # ============================================================
      # 6. CONFIGURE ANDROID PERMISSIONS
      # ============================================================

      - name: Configure Android permissions
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          manifest_open = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          INTERNET = '    <uses-permission android:name="android.permission.INTERNET"/>'
          CAMERA = '    <uses-permission android:name="android.permission.CAMERA"/>'

          if 'android.permission.INTERNET' not in text:
              if manifest_open not in text:
                  raise SystemExit(
                      "ERROR: Android manifest opening tag not found."
                  )

              text = text.replace(
                  manifest_open,
                  manifest_open + "\n" + INTERNET,
                  1
              )

          if "${{ matrix.app }}" == "client_app":
              if 'android.permission.CAMERA' not in text:
                  if manifest_open not in text:
                      raise SystemExit(
                          "ERROR: Android manifest opening tag not found."
                      )

                  text = text.replace(
                      manifest_open,
                      manifest_open + "\n" + CAMERA,
                      1
                  )

          manifest.write_text(text)

          print("Android permissions configured successfully.")
          PY

          echo ""
          echo "Configured permissions:"
          grep -n "uses-permission" "$MANIFEST" || true


      # ============================================================
      # 7. CONFIGURE COMPILE SDK
      # ============================================================

      - name: Configure Android compile SDK
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          found = False

          for path in candidates:
              if not path.exists():
                  continue

              found = True

              text = path.read_text()

              # Kotlin DSL
              text = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 36',
                  text
              )

              # Groovy
              text = re.sub(
                  r'compileSdkVersion\s+\d+',
                  'compileSdkVersion 36',
                  text
              )

              # Flutter generated compile SDK
              text = text.replace(
                  'compileSdk = flutter.compileSdkVersion',
                  'compileSdk = 36'
              )

              path.write_text(text)

              print(f"Updated: {path}")

          if not found:
              raise SystemExit(
                  "ERROR: Android Gradle build file was not found."
              )
          PY

          echo ""
          echo "Compile SDK configuration:"
          grep -R "compileSdk" android/app 2>/dev/null || true


      # ============================================================
      # 8. FLUTTER CLEAN
      # ============================================================

      - name: Flutter clean
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          set -e

          flutter clean

          echo "Flutter clean completed."


      # ============================================================
      # 9. INSTALL DEPENDENCIES
      # ============================================================

      - name: Flutter dependencies
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          set -e

          flutter pub get

          echo ""
          echo "Flutter dependencies installed successfully."


      # ============================================================
      # 10. DART ANALYSIS
      # ============================================================

      - name: Analyze Dart
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          set -e

          echo "Running Flutter analyzer..."

          flutter analyze --no-fatal-infos

          echo ""
          echo "Dart analysis completed successfully."


      # ============================================================
      # 11. BUILD RELEASE APK
      # ============================================================

      - name: Build release APK
        working-directory: ${{ matrix.app }}
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          CLIENT_APK_URL: ${{ inputs.client_apk_url }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Cloud-Zen Release APK Build"
          echo "=========================================="
          echo "Application: ${{ matrix.app }}"
          echo "Backend URL: $API_BASE_URL"
          echo ""

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=CLIENT_APK_URL="$CLIENT_APK_URL"

          echo ""
          echo "Release APK build completed successfully."


      # ============================================================
      # 12. VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "Checking APK..."

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "APK VERIFIED"
          echo "=========================================="
          echo "Application: ${{ matrix.app }}"
          echo "APK: $APK"
          echo "Size: $SIZE bytes"
          echo ""

          ls -lh "$APK"


      # ============================================================
      # 13. UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-zen-${{ matrix.app }}-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
