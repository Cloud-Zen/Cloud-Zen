name: Cloud-Zen Android APKs

on:
  workflow_dispatch:

jobs:
  master:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-zen-master-apk
          path: master_app/build/app/outputs/flutter-apk/app-release.apk

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-zen-client-apk
          path: client_app/build/app/outputs/flutter-apk/app-release.apk
