name: Cloud-Zen Android APKs

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  API_BASE_URL: https://cloud-zen-backend.onrender.com

jobs:
  master:
    name: Build Master APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: master_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project
        run: flutter create --platforms=android --no-pub .

      - name: Connect Master to Cloud-Zen Backend
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          api_url = "https://cloud-zen-backend.onrender.com"
          candidates = [
              Path("lib/main.dart"),
              Path("lib/api.dart"),
              Path("lib/config.dart"),
          ]

          changed = False

          for path in candidates:
              if not path.exists():
                  continue

              text = path.read_text()

              replacements = [
                  "https://YOUR-RENDER-SERVICE.onrender.com",
                  "https://YOUR-BACKEND.onrender.com",
              ]

              new_text = text

              for old in replacements:
                  new_text = new_text.replace(old, api_url)

              if new_text != text:
                  path.write_text(new_text)
                  print(f"Updated backend URL in {path}")
                  changed = True

          if not changed:
              print("No placeholder backend URL found.")
              print("The app may already contain a configured API URL.")
          PY

      - name: Verify Master Backend URL
        shell: bash
        run: |
          set -e

          echo "Cloud-Zen Master backend:"
          echo "$API_BASE_URL"

          if grep -R "YOUR-RENDER-SERVICE" lib 2>/dev/null; then
            echo "ERROR: Master still contains YOUR-RENDER-SERVICE placeholder."
            exit 1
          fi

          if grep -R "YOUR-BACKEND" lib 2>/dev/null; then
            echo "ERROR: Master still contains YOUR-BACKEND placeholder."
            exit 1
          fi

          echo "Master backend URL verification: PASSED"

      - name: Force compileSdk 36 - Master
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle.kts"

          if [ -f "$FILE" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'(?m)^[ \t]*compileSdk\s+36\s*$\n?',
              '',
              s
          )

          s = re.sub(
              r'(?m)^([ \t]*)compileSdk\s*=\s*[^\n]+$',
              r'\1compileSdk = 36',
              s
          )

          if not re.search(r'(?m)^\s*compileSdk\s*=\s*36\s*$', s):
              s = re.sub(
                  r'(?m)^(\s*android\s*\{\s*)$',
                  r'\1\n    compileSdk = 36',
                  s,
                  count=1
              )

          p.write_text(s)
          PY
          else
            FILE="android/app/build.gradle"

            if [ -f "$FILE" ]; then
              python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s = re.sub(
              r'(?m)^[ \t]*compileSdk\s*=\s*[^\n]+$',
              '',
              s
          )

          s = re.sub(
              r'(?m)^([ \t]*)compileSdkVersion\s+[^\n]+$',
              r'\1compileSdkVersion 36',
              s
          )

          s = re.sub(
              r'(?m)^([ \t]*)compileSdk\s+[^\n]+$',
              r'\1compileSdk 36',
              s
          )

          if not re.search(r'(?m)^\s*compileSdk(?:Version)?\s+36\s*$', s):
              s = re.sub(
                  r'(?m)^(\s*android\s*\{\s*)$',
                  r'\1\n    compileSdk 36',
                  s,
                  count=1
              )

          p.write_text(s)
          PY
            else
              echo "ERROR: No Android app Gradle file found."
              exit 1
            fi
          fi

      - name: Verify Master compileSdk
        shell: bash
        run: |
          set -e

          if [ -f android/app/build.gradle.kts ]; then
            echo "===== Master Gradle ====="
            cat android/app/build.gradle.kts

            if grep -Eq '^[[:space:]]*compileSdk[[:space:]]+36[[:space:]]*$' android/app/build.gradle.kts; then
              echo "ERROR: Invalid Kotlin DSL syntax detected."
              exit 1
            fi

            if ! grep -Eq '^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*36[[:space:]]*$' android/app/build.gradle.kts; then
              echo "ERROR: compileSdk = 36 was not found."
              exit 1
            fi

            echo "Master compileSdk verification: PASSED"
          else
            echo "===== Master Gradle ====="
            cat android/app/build.gradle

            if ! grep -Eq '^[[:space:]]*compileSdkVersion[[:space:]]+36[[:space:]]*$|^[[:space:]]*compileSdk[[:space:]]+36[[:space:]]*$' android/app/build.gradle; then
              echo "ERROR: compileSdk 36 was not found."
              exit 1
            fi

            echo "Master compileSdk verification: PASSED"
          fi

      - name: Get Master dependencies
        run: flutter pub get

      - name: Build Master APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Upload Master APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-zen-master-apk
          path: master_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


