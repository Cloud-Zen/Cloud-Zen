name: Cloud-Zen Android APKs

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  API_BASE_URL: https://cloud-zen-backend.onrender.com

jobs:

  master:
    name: Build Master APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: master_app

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android
        run: flutter create --platforms=android --no-pub .

      - name: Configure Master Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")

          if p.exists():
              s = p.read_text()

              s = re.sub(
                  r'applicationId\s*=\s*"[^"]+"',
                  'applicationId = "com.cloudzen.master"',
                  s
              )

              s = re.sub(
                  r'compileSdk\s*=\s*[^\n]+',
                  'compileSdk = 36',
                  s
              )

              p.write_text(s)

          p2 = Path("android/app/build.gradle")

          if p2.exists():
              s = p2.read_text()

              s = re.sub(
                  r'applicationId\s+"[^"]+"',
                  'applicationId "com.cloudzen.master"',
                  s
              )

              s = re.sub(
                  r'compileSdkVersion\s+\S+',
                  'compileSdkVersion 36',
                  s
              )

              s = re.sub(
                  r'compileSdk\s+\S+',
                  'compileSdk 36',
                  s
              )

              p2.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Verify API
        run: |
          grep -R "API_BASE_URL" lib/main.dart

      - name: Build Master APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Upload Master APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-zen-master-apk
          path: master_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


  client:
    name: Build Client APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client_app

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android
        run: flutter create --platforms=android --no-pub .

      - name: Configure Client Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")

          if p.exists():
              s = p.read_text()

              s = re.sub(
                  r'applicationId\s*=\s*"[^"]+"',
                  'applicationId = "com.cloudzen.client"',
                  s
              )

              s = re.sub(
                  r'compileSdk\s*=\s*[^\n]+',
                  'compileSdk = 36',
                  s
              )

              p.write_text(s)

          p2 = Path("android/app/build.gradle")

          if p2.exists():
              s = p2.read_text()

              s = re.sub(
                  r'applicationId\s+"[^"]+"',
                  'applicationId "com.cloudzen.client"',
                  s
              )

              s = re.sub(
                  r'compileSdkVersion\s+\S+',
                  'compileSdkVersion 36',
                  s
              )

              s = re.sub(
                  r'compileSdk\s+\S+',
                  'compileSdk 36',
                  s
              )

              p2.write_text(s)

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if manifest.exists():
              s = manifest.read_text()

              if "android.permission.CAMERA" not in s:
                  s = s.replace(
                      "<application",
                      '<uses-permission android:name="android.permission.CAMERA"/>\n\n    <application',
                      1
                  )

              manifest.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Verify API
        run: |
          grep -R "API_BASE_URL" lib/main.dart

      - name: Build Client APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-zen-client-apk
          path: client_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
