name: Cloud-Zen Android APKs

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Cloud-Zen backend HTTPS URL"
        required: true
        default: "https://cloud-zen-backend.onrender.com"

      client_apk_url:
        description: "HTTPS URL of Client APK"
        required: false
        default: ""

permissions:
  contents: read

jobs:

  # ============================================================
  # MASTER APK
  # ============================================================
  build-master:
    name: Build Master APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Master source
        working-directory: master_app
        shell: bash
        run: |
          set -e

          test -f pubspec.yaml
          test -f lib/main.dart

          echo "Master source found."

          grep -q "API_BASE_URL" lib/main.dart

          echo "Master API_BASE_URL configuration found."

      - name: Generate Android project
        working-directory: master_app
        run: |
          flutter create --platforms=android .

      - name: Configure Master Android
        working-directory: master_app
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i \
              's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>#' \
              "$MANIFEST"
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E \
              's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' \
              android/app/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i -E \
              's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' \
              android/app/build.gradle
          fi

          echo "Master Android configuration complete."

      - name: Flutter dependencies
        working-directory: master_app
        run: |
          flutter pub get

      - name: Build Master release APK
        working-directory: master_app
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          CLIENT_APK_URL: ${{ inputs.client_apk_url }}
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=CLIENT_APK_URL="$CLIENT_APK_URL"

      - name: Verify Master APK
        working-directory: master_app
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          ls -lh \
            build/app/outputs/flutter-apk/app-release.apk

          echo "MASTER APK BUILD SUCCESS."

      - name: Upload Master APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-zen-master-apk
          path: master_app/build/app/outputs/flutter-apk/app-release.apk


  # ============================================================
  # CLIENT APK
  # ============================================================
  build-client:
    name: Build Client APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------------
      # IMPORTANT:
      # DO NOT CHECK API_BASE_URL HERE.
      #
      # Client receives backend URL from pairing QR:
      #
      # QR -> server -> /api/pairing/approve
      #
      # Therefore API_BASE_URL is NOT required in client main.dart.
      # --------------------------------------------------------
      - name: Check Client source
        working-directory: client_app
        shell: bash
        run: |
          set -e

          test -f pubspec.yaml
          test -f lib/main.dart

          echo "Client source found."

          grep -q "class CloudZenClient" lib/main.dart
          grep -q "scanAndPair" lib/main.dart
          grep -q "api/pairing/approve" lib/main.dart

          echo "Client pairing code found."

      - name: Generate Android project
        working-directory: client_app
        run: |
          flutter create --platforms=android .

      - name: Configure Client Android
        working-directory: client_app
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i \
              's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>#' \
              "$MANIFEST"
          fi

          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i \
              's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.CAMERA"/>#' \
              "$MANIFEST"
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E \
              's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' \
              android/app/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i -E \
              's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' \
              android/app/build.gradle
          fi

          echo "Client Android configuration complete."

      - name: Flutter dependencies
        working-directory: client_app
        run: |
          flutter pub get

      - name: Analyze Client Dart
        working-directory: client_app
        run: |
          flutter analyze --no-fatal-infos

      - name: Build Client release APK
        working-directory: client_app
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Verify Client APK
        working-directory: client_app
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          ls -lh \
            build/app/outputs/flutter-apk/app-release.apk

          echo "CLIENT APK BUILD SUCCESS."

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-zen-client-apk
          path: client_app/build/app/outputs/flutter-apk/app-release.apk
