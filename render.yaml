services:
  - type: web
    name: cloud-zen
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: DELETE_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: TELEGRAM_STORAGE_CHAT
        value: me
      - key: CHUNK_SIZE
        value: "16777216"
      - key: MAX_ACTIVE_UPLOAD_REQUESTS
        value: "6"
      - key: TELEGRAM_UPLOAD_CONCURRENCY
        value: "3"
      - key: TELEGRAM_WORKERS
        value: "8"
      - key: TELEGRAM_UPLOAD_RETRIES
        value: "4"
        
