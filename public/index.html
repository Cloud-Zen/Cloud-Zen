<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AetherCloud Mobile</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#000000',
                        cardbg: '#121212',
                        cardborder: '#262626',
                        accent: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(16px); }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-darkbg text-gray-100 min-h-screen flex flex-col justify-between selection:bg-accent selection:text-white">

    <!-- 1. Welcome / Splash Screen (2-3 Seconds) -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-darkbg flex flex-col items-center justify-center transition-opacity duration-700 px-6">
        <div class="relative flex items-center justify-center mb-6">
            <div class="absolute w-28 h-28 bg-accent rounded-full blur-2xl opacity-40 animate-pulse"></div>
            <i class="fa-solid fa-cloud-arrow-up text-7xl text-accent relative z-10"></i>
        </div>
        <h1 class="text-3xl font-bold tracking-wider text-white mb-1">AETHER<span class="text-accent">CLOUD</span></h1>
        <p class="text-xs text-gray-400 tracking-widest uppercase mb-8">Telegram Backed Mobile Storage</p>
        <div class="w-40 h-1 bg-gray-900 rounded-full overflow-hidden">
            <div id="loading-bar" class="h-full bg-accent w-0 transition-all duration-[2500ms]"></div>
        </div>
    </div>

    <!-- 2. Main Mobile App Interface -->
    <div id="app-container" class="opacity-0 transition-opacity duration-700 flex flex-col flex-1 max-w-md mx-auto w-full pb-20">
        
        <!-- Mobile Top Header -->
        <header class="sticky top-0 z-30 glass border-b border-cardborder px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-accent to-indigo-600 flex items-center justify-center font-bold text-white text-sm shadow-md">
                    MS
                </div>
                <div>
                    <h2 class="text-sm font-semibold text-white leading-tight">My Drive</h2>
                    <span class="text-[10px] text-gray-400" id="storage-info">1.4 GB of 50 GB used</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="toggleSearch()" class="w-9 h-9 rounded-full bg-cardbg border border-cardborder flex items-center justify-center text-gray-300 hover:text-white">
                    <i class="fa-solid fa-search text-xs"></i>
                </button>
                <button onclick="openSettings()" class="w-9 h-9 rounded-full bg-cardbg border border-cardborder flex items-center justify-center text-gray-300 hover:text-white">
                    <i class="fa-solid fa-gear text-xs"></i>
                </button>
            </div>
        </header>

        <!-- Search Bar Drawer (Hidden by default) -->
        <div id="search-drawer" class="hidden px-4 py-2 bg-cardbg border-b border-cardborder">
            <input type="text" id="search-box" oninput="searchFiles()" placeholder="Search files, docs, media..." class="w-full bg-black border border-cardborder rounded-xl px-4 py-2 text-xs text-gray-200 focus:outline-none focus:border-accent">
        </div>

        <!-- Storage Quick Status Bar -->
        <div class="px-4 py-3">
            <div class="bg-cardbg border border-cardborder rounded-2xl p-3 shadow-lg flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 rounded-xl bg-accent/10 text-accent">
                        <i class="fa-solid fa-database text-sm"></i>
                    </div>
                    <div>
                        <h4 class="text-xs font-medium text-white">Telegram Cloud Sync</h4>
                        <p class="text-[10px] text-green-400 font-semibold flex items-center mt-0.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-ping mr-1.5"></span> Connected Online
                        </p>
                    </div>
                </div>
                <label class="bg-accent hover:bg-blue-600 text-white text-xs font-medium px-3.5 py-2 rounded-xl cursor-pointer shadow-lg transition-all flex items-center space-x-1.5">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>Upload</span>
                    <input type="file" id="file-input" class="hidden" onchange="handleFileUpload(event)">
                </label>
            </div>
        </div>

        <!-- Filter Chips -->
        <div class="px-4 flex space-x-2 overflow-x-auto no-scrollbar py-1">
            <button onclick="filterFiles('all')" id="chip-all" class="px-3 py-1.5 rounded-xl text-xs bg-accent text-white font-medium whitespace-nowrap transition-colors">All Files</button>
            <button onclick="filterFiles('pdf')" id="chip-pdf" class="px-3 py-1.5 rounded-xl text-xs bg-cardbg border border-cardborder text-gray-300 whitespace-nowrap transition-colors">Documents & PDFs</button>
            <button onclick="filterFiles('media')" id="chip-media" class="px-3 py-1.5 rounded-xl text-xs bg-cardbg border border-cardborder text-gray-300 whitespace-nowrap transition-colors">Media & Photos</button>
        </div>

        <!-- File List Container -->
        <main class="flex-1 px-4 py-3 space-y-2.5" id="file-list-container">
            <!-- Dynamic Files Rendered Here -->
        </main>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 px-4 text-center">
            <i class="fa-solid fa-cloud-moon text-5xl text-gray-700 mb-3"></i>
            <p class="text-gray-400 text-xs">No files found. Tap upload to sync files directly to Telegram!</p>
        </div>
    </div>

    <!-- 3. Mobile Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 glass border-t border-cardborder px-6 py-2.5 max-w-md mx-auto flex items-center justify-between">
        <button onclick="filterFiles('all')" class="flex flex-col items-center text-accent">
            <i class="fa-solid fa-folder text-base"></i>
            <span class="text-[10px] mt-1 font-medium">Files</span>
        </button>
        <button onclick="showRecent()" class="flex flex-col items-center text-gray-400 hover:text-white">
            <i class="fa-solid fa-clock-rotate-left text-base"></i>
            <span class="text-[10px] mt-1 font-medium">Recent</span>
        </button>
        <!-- Center Floating Upload Trigger -->
        <label class="w-12 h-12 -mt-6 bg-accent hover:bg-blue-600 rounded-full shadow-lg shadow-blue-500/30 flex items-center justify-center text-white cursor-pointer transition-transform active:scale-95">
            <i class="fa-solid fa-arrow-up text-lg"></i>
            <input type="file" class="hidden" onchange="handleFileUpload(event)">
        </label>
        <button onclick="showStarred()" class="flex flex-col items-center text-gray-400 hover:text-white">
            <i class="fa-solid fa-star text-base"></i>
            <span class="text-[10px] mt-1 font-medium">Starred</span>
        </button>
        <button onclick="openSettings()" class="flex flex-col items-center text-gray-400 hover:text-white">
            <i class="fa-solid fa-user text-base"></i>
            <span class="text-[10px] mt-1 font-medium">Profile</span>
        </button>
    </nav>

    <!-- PDF & Document Viewer Modal -->
    <div id="pdf-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex flex-col">
        <div class="px-4 py-3 border-b border-cardborder flex items-center justify-between bg-cardbg">
            <h3 id="pdf-modal-title" class="text-xs font-semibold text-white truncate max-w-[250px]">Document Preview</h3>
            <button onclick="closePdfModal()" class="w-8 h-8 rounded-full bg-black/50 text-gray-300 flex items-center justify-center"><i class="fa-solid fa-xmark text-sm"></i></button>
        </div>
        <div class="flex-1 p-2 flex items-center justify-center">
            <iframe id="pdf-frame" class="w-full h-full rounded-xl border border-cardborder bg-white" src=""></iframe>
        </div>
    </div>

    <!-- JavaScript Logic for Mobile Features -->
    <script>
        // Splash Timer
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.getElementById('loading-bar').style.width = '100%'; }, 100);
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const app = document.getElementById('app-container');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    app.style.opacity = '1';
                }, 700);
            }, 2500);
        });

        let files = JSON.parse(localStorage.getItem('mobile_cloud_files')) || [
            { id: 1, name: 'Tax_Invoice_2026.pdf', size: '1.8 MB', date: '06 Sep 2026', type: 'pdf', url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf' },
            { id: 2, name: 'Vacation_Photo.jpg', size: '3.2 MB', date: '05 Sep 2026', type: 'media', url: '#' },
            { id: 3, name: 'Project_Blueprint.pdf', size: '4.5 MB', date: '04 Sep 2026', type: 'pdf', url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf' }
        ];

        function saveAndRender() {
            localStorage.setItem('mobile_cloud_files', JSON.stringify(files));
            renderFiles(files);
        }

        function getFileIcon(type) {
            if (type === 'pdf') return '<div class="w-10 h-10 rounded-xl bg-red-500/10 text-red-400 flex items-center justify-center text-base"><i class="fa-solid fa-file-pdf"></i></div>';
            if (type === 'media') return '<div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-base"><i class="fa-solid fa-file-image"></i></div>';
            return '<div class="w-10 h-10 rounded-xl bg-gray-800 text-gray-400 flex items-center justify-center text-base"><i class="fa-solid fa-file"></i></div>';
        }

        function renderFiles(fileList) {
            const container = document.getElementById('file-list-container');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = '';

            if(fileList.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            fileList.forEach(file => {
                const card = document.createElement('div');
                card.className = 'bg-cardbg border border-cardborder rounded-2xl p-3 flex items-center justify-between shadow-md active:scale-[0.99] transition-transform';
                card.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden cursor-pointer" onclick="${file.type === 'pdf' ? `openPdf('${file.url}', '${file.name}')` : `downloadFile(${file.id})`}">
                        ${getFileIcon(file.type)}
                        <div class="truncate">
                            <h4 class="text-xs font-semibold text-gray-100 truncate">${file.name}</h4>
                            <p class="text-[10px] text-gray-400 mt-0.5">${file.size} • ${file.date}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1">
                        ${file.type === 'pdf' ? `<button onclick="openPdf('${file.url}', '${file.name}')" class="w-8 h-8 rounded-lg text-gray-400 hover:text-accent flex items-center justify-center"><i class="fa-solid fa-eye text-xs"></i></button>` : ''}
                        <button onclick="openActionMenu(${file.id})" class="w-8 h-8 rounded-lg text-gray-400 hover:text-white flex items-center justify-center"><i class="fa-solid fa-ellipsis-vertical text-xs"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Telegram Backend Simulation Upload
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if(!file) return;

            // Note: वास्तविक प्रोडक्शन में यहाँ Telegram Bot API endpoint पर FormData भेजा जाएगा।
            const reader = new FileReader();
            reader.onload = function(e) {
                const newFile = {
                    id: Date.now(),
                    name: file.name,
                    size: (file.size / (1024*1024)).toFixed(1) + ' MB',
                    date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }),
                    type: file.type.includes('pdf') ? 'pdf' : (file.type.includes('image') ? 'media' : 'other'),
                    url: e.target.result
                };
                files.unshift(newFile);
                saveAndRender();
                alert('File uploaded successfully & synced to Telegram Backend! 🚀');
            };
            reader.readAsDataURL(file);
        }

        function openActionMenu(id) {
            const file = files.find(f => f.id === id);
            const action = prompt(`Options for "${file.name}":\n1. Rename\n2. Download\n3. Share\n4. Delete\n\nEnter choice number (1-4):`, "2");
            
            if(action === "1") {
                const newName = window.prompt("Enter new filename:", file.name);
                if(newName) { file.name = newName; saveAndRender(); }
            } else if(action === "2") {
                downloadFile(id);
            } else if(action === "3") {
                navigator.clipboard.writeText(`https://aethercloud.app/file/${id}`);
                alert('Secure share link copied to clipboard!');
            } else if(action === "4") {
                if(confirm('Delete file from cloud?')) {
                    files = files.filter(f => f.id !== id);
                    saveAndRender();
                }
            }
        }

        function downloadFile(id) {
            const file = files.find(f => f.id === id);
            const a = document.createElement('a');
            a.href = file.url;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function openPdf(url, name) {
            document.getElementById('pdf-modal-title').innerText = name;
            document.getElementById('pdf-frame').src = url;
            document.getElementById('pdf-modal').classList.remove('hidden');
        }

        function closePdfModal() {
            document.getElementById('pdf-modal').classList.add('hidden');
            document.getElementById('pdf-frame').src = '';
        }

        function toggleSearch() {
            const drawer = document.getElementById('search-drawer');
            drawer.classList.toggle('hidden');
        }

        function searchFiles() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const filtered = files.filter(f => f.name.toLowerCase().includes(query));
            renderFiles(filtered);
        }

        function filterFiles(type) {
            if(type === 'all') {
                renderFiles(files);
            } else {
                renderFiles(files.filter(f => f.type === type));
            }
        }

        function showRecent() { alert('Showing recent files sorted by upload date.'); }
        function showStarred() { alert('No starred files yet.'); }
        function openSettings() { alert('Cloud Storage Plan: 50 GB Telegram Connected.\nDeveloper: You 🚀'); }

        renderFiles(files);
    </script>
</body>
  </html>
